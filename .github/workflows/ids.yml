name: ID databases

# Rebuilds the hardware ID database bundle from upstream every week and
# publishes it, signed, as the `ids-latest` release that `hwspec ids update`
# downloads. Each published bundle is also kept as a dated release.
#
#   build   (read-only, no secrets)   fetch upstream, validate, compare with
#                                      the last bundle, upload as an artifact
#   publish (ids-signing environment) re-verify the artifact, sign, release
#
# The signing key lives in the `ids-signing` environment, which only the
# main branch can use, and only the publish job, which runs no upstream
# data processing beyond re-verification, sees it.

on:
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency: ids

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    env:
      GH_TOKEN: ${{ github.token }}
      BUNDLE: build/ids-bundle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false # never reuse a cache other workflows could have written

      - name: Fetch upstream sources (HTTPS only)
        run: make fetch-ids

      - name: Previous manifest
        # Fail closed: only a confirmed "no such release" means first publish.
        # Any other error (API outage, rate limit) must not skip the
        # comparison with the previous bundle.
        run: |
          mkdir -p build
          if out=$(gh release view ids-latest --json tagName 2>&1); then
            gh release download ids-latest -p manifest.json -O build/prev-manifest.json
          elif grep -q "release not found" <<<"$out"; then
            echo "No previous bundle; publishing the first one."
          else
            echo "::error::Can't check the previous bundle: $out"; exit 1
          fi

      - name: Build, validate and compare with the previous bundle
        run: make gen-ids DIR="$BUNDLE" PREV=build/prev-manifest.json

      - name: Skip if nothing changed
        id: diff
        run: |
          new=$(jq -S '.files | map_values(.sha256)' "$BUNDLE/manifest.json")
          old=$(jq -S '.files | map_values(.sha256)' build/prev-manifest.json 2>/dev/null || echo null)
          if [ "$new" = "$old" ]; then
            echo "Upstream unchanged since the last bundle."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.diff.outputs.changed == 'true'
        with:
          name: ids-bundle
          path: build/ids-bundle/
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    environment: ids-signing
    permissions:
      contents: write # create and update the ids-* releases
    env:
      GH_TOKEN: ${{ github.token }}
      BUNDLE: build/ids-bundle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ids-bundle
          path: build/ids-bundle

      - name: Previous manifest (again, independently of the build job)
        # Fail closed: only a confirmed "no such release" means first publish.
        # Any other error (API outage, rate limit) must not skip the
        # comparison with the previous bundle.
        run: |
          mkdir -p build
          if out=$(gh release view ids-latest --json tagName 2>&1); then
            gh release download ids-latest -p manifest.json -O build/prev-manifest.json
          elif grep -q "release not found" <<<"$out"; then
            echo "No previous bundle; publishing the first one."
          else
            echo "::error::Can't check the previous bundle: $out"; exit 1
          fi

      # Also: the bundle's knowledge base is the committed one, byte for
      # byte, so the build job can't slip in rules of its own (#185).
      - name: Re-verify the bundle before signing
        run: go run ./tools/genids verify "$BUNDLE" build/prev-manifest.json internal/kb/data

      - name: Sign
        env:
          HWSPEC_IDS_SIGNING_KEY: ${{ secrets.HWSPEC_IDS_SIGNING_KEY }}
        run: go run ./tools/genids sign "$BUNDLE/manifest.json"

      - name: Publish
        run: |
          date=$(date -u +%Y.%m.%d)
          notes="Hardware ID databases built from upstream on $date, and the advisor knowledge base as committed. Installed by \`hwspec ids update\`; see manifest.json for per-file dates and counts."
          files=("$BUNDLE"/*.ids.gz "$BUNDLE"/advisor-v*.json.gz)

          # Dated copy, kept for history and rollback.
          gh release view "ids-$date" >/dev/null 2>&1 \
            || gh release create "ids-$date" "${files[@]}" "$BUNDLE/manifest.json" "$BUNDLE/manifest.json.sig" \
                 --title "ID databases $date" --notes "$notes" --latest=false --prerelease

          # The moving release clients read. Data first, manifest last, so a
          # client never sees a manifest describing files not yet uploaded.
          gh release view ids-latest >/dev/null 2>&1 \
            || gh release create ids-latest --title "ID databases (latest)" \
                 --notes "Always the newest bundle; see the dated ids-* releases for history." --latest=false --prerelease
          gh release upload ids-latest "${files[@]}" --clobber
          gh release upload ids-latest "$BUNDLE/manifest.json.sig" "$BUNDLE/manifest.json" --clobber
