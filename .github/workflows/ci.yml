name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Minimum total statement coverage across all packages (see scripts/coverage.sh).
  COVERAGE_MIN: "35"

jobs:
  # Which parts of CI this change needs (scripts/changed-areas.sh). Pushes
  # to main and merge-queue runs always run everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.areas.outputs.go }}
      nix: ${{ steps.areas.outputs.nix }}
      workflows: ${{ steps.areas.outputs.workflows }}
      docs: ${{ steps.areas.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: areas
        shell: bash # -o pipefail: a failing script must fail the step, not hide behind tee
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            scripts/changed-areas.sh "$BASE" "$HEAD" | tee -a "$GITHUB_OUTPUT"
          else
            printf 'go=true\nnix=true\nworkflows=true\ndocs=true\n' | tee -a "$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - name: go mod tidy is clean
        run: go mod tidy -diff

  test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The Go releases the Go team supports; the oldest is go.mod's minimum.
        go: ["1.26", stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - name: Test (race detector, coverage)
        run: go test -race -count=1 -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Coverage gate
        if: matrix.go == 'stable'
        run: scripts/coverage.sh coverage.out "$COVERAGE_MIN" >> "$GITHUB_STEP_SUMMARY"

  vulncheck:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  build:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Build static amd64 and arm64
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOARCH=$arch go build -trimpath -ldflags "-s -w" -o dist/hwspec-$arch ./cmd/hwspec
            file dist/hwspec-$arch | tee /dev/stderr | grep -q 'statically linked'
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hwspec-binaries
          path: dist/
          retention-days: 7

  # The same static binary must run on every target distro, with names
  # resolved (from the distro's ID files or the embedded copies).
  distros:
    needs: [changes, build]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - docker.io/library/ubuntu:24.04
          - docker.io/library/debian:12
          - registry.fedoraproject.org/fedora:latest
          - docker.io/library/archlinux:latest
          - docker.io/library/alpine:latest
          - docker.io/nixos/nix:latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hwspec-binaries
      - name: Capture inside ${{ matrix.image }}
        run: |
          chmod +x hwspec-amd64
          docker run --rm --network=none -v "$PWD/hwspec-amd64:/hwspec:ro" "${{ matrix.image }}" /hwspec capture -f json > out.json
          # Runner hardware varies (some Hyper-V VMs have no PCI bus), so check
          # invariants rather than specific devices.
          jq '{schema: (.schema_version == 1), container: (.os.virtualization == "container"),
               cpu_model: (.cpu.model != ""), memory: (.memory.total_bytes > 0),
               os: .os.pretty_name, pci_devices: (.pci | length), warnings: .warnings}' out.json | tee checks.json
          jq -e '[.schema, .container, .cpu_model, .memory] | all' checks.json
          docker run --rm --network=none -v "$PWD/hwspec-amd64:/hwspec:ro" "${{ matrix.image }}" /hwspec ids
          # Names resolve on every distro, from its own files or the embedded copies.
          for q in "pci 8086" "usb 046d" "jedec 80CE" "cpu intel:6:9e:10"; do
            read -ra lookup <<<"$q" # "KIND ID" as two arguments
            docker run --rm --network=none -v "$PWD/hwspec-amd64:/hwspec:ro" "${{ matrix.image }}" /hwspec ids lookup "${lookup[@]}"
          done

  nix:
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build the flake (catches a stale vendorHash)
        run: nix build .#hwspec --print-build-logs && ./result/bin/hwspec capture -f text

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # PRs are rebase-merged, so every commit lands on main as written.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every commit follows Conventional Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-commits.sh "$BASE" "$HEAD"

  # Workflow syntax, expressions and embedded shell (shellcheck).
  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint (bundled shellcheck, pinned by digest)
        run: docker run --rm -v "$PWD:/repo" -w /repo docker.io/rhysd/actionlint:1.7.12@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7

  # Every Mermaid diagram in the Markdown must render (docs rule).
  mermaid:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render all diagrams
        env:
          MERMAID_IMAGE: docker.io/minlag/mermaid-cli:12.0.0@sha256:30a3ca1a8af8632e9aee021e6a39738ff876239c5307f03734e89c5364ff5f38
        run: git ls-files -z '*.md' | xargs -0 -r scripts/check-mermaid.sh

  # The single required check for branch protection. Jobs a change doesn't
  # need are skipped and count as passed; `changes` itself must succeed, or
  # a failure there would skip everything and pass vacuously.
  ci-ok:
    if: always()
    needs: [changes, lint, test, vulncheck, build, distros, nix, actionlint, mermaid, pr-title, commits]
    runs-on: ubuntu-latest
    steps:
      - name: All needed checks passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # `changes` must have succeeded AND produced every output; without
          # them each gated job would be skipped and this gate pass vacuously.
          echo "$NEEDS" | jq -e '.changes.result == "success"
            and (.changes.outputs | has("go") and has("nix") and has("workflows") and has("docs"))
            and (.changes.outputs | to_entries | all(.value == "true" or .value == "false"))
            and (to_entries | all(.value.result == "success" or .value.result == "skipped"))'
