name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Minimum total statement coverage across all packages (see scripts/coverage.sh).
  COVERAGE_MIN: "35"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          go-version: stable
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - name: go mod tidy is clean
        run: go mod tidy -diff

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22", stable] # oldest supported (go.mod), and current
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - name: Test (race detector, coverage)
        run: go test -race -count=1 -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Coverage gate
        if: matrix.go == 'stable'
        run: scripts/coverage.sh coverage.out "$COVERAGE_MIN" >> "$GITHUB_STEP_SUMMARY"

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Build static amd64 and arm64
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOARCH=$arch go build -trimpath -ldflags "-s -w" -o dist/hwspec-$arch ./cmd/hwspec
            file dist/hwspec-$arch | tee /dev/stderr | grep -q 'statically linked'
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hwspec-binaries
          path: dist/
          retention-days: 7

  # The same static binary must run on every target distro, with names
  # resolved (from the distro's ID files or the embedded copies).
  distros:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - docker.io/library/ubuntu:24.04
          - docker.io/library/debian:12
          - registry.fedoraproject.org/fedora:latest
          - docker.io/library/archlinux:latest
          - docker.io/library/alpine:latest
          - docker.io/nixos/nix:latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hwspec-binaries
      - name: Capture inside ${{ matrix.image }}
        run: |
          chmod +x hwspec-amd64
          docker run --rm --network=none -v "$PWD/hwspec-amd64:/hwspec:ro" "${{ matrix.image }}" /hwspec capture -f json > out.json
          # Runner hardware varies (some Hyper-V VMs have no PCI bus), so check
          # invariants rather than specific devices.
          jq '{schema: (.schema_version == 1), container: (.os.virtualization == "container"),
               cpu_model: (.cpu.model != ""), memory: (.memory.total_bytes > 0),
               os: .os.pretty_name, pci_devices: (.pci | length), warnings: .warnings}' out.json | tee checks.json
          jq -e '[.schema, .container, .cpu_model, .memory] | all' checks.json
          docker run --rm --network=none -v "$PWD/hwspec-amd64:/hwspec:ro" "${{ matrix.image }}" /hwspec ids
          # Names resolve on every distro, from its own files or the embedded copies.
          for q in "pci 8086" "usb 046d" "jedec 80CE" "cpu intel:6:9e:10"; do
            docker run --rm --network=none -v "$PWD/hwspec-amd64:/hwspec:ro" "${{ matrix.image }}" /hwspec ids lookup $q
          done

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build the flake (catches a stale vendorHash)
        run: nix build .#hwspec --print-build-logs && ./result/bin/hwspec capture -f text

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # The single required check for branch protection.
  ci-ok:
    if: always()
    needs: [lint, test, vulncheck, build, distros, nix, pr-title]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed (pr-title may be skipped outside PRs)
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
