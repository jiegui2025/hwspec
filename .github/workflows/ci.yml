name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Minimum total statement coverage across all packages (see scripts/coverage.sh).
  COVERAGE_MIN: "95"

jobs:
  # Which parts of CI this change needs (scripts/changed-areas.sh). Pushes
  # to main and merge-queue runs run everything except the VMs and the
  # tamper test: a merged tree's VMs booted in its PR's run, edge.yml ->
  # verify.yml runs the tamper test on the published build, and releases
  # boot the VMs again there (#175).
  # A push whose tree is exactly a merged PR's head, whose CI passed,
  # runs nothing more: that tree was just tested (#152).
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read # the PR a pushed commit came from
      checks: read        # that PR head's ci-ok
      actions: read       # and its CI run
    outputs:
      go: ${{ steps.areas.outputs.go }}
      nix: ${{ steps.areas.outputs.nix }}
      workflows: ${{ steps.areas.outputs.workflows }}
      docs: ${{ steps.areas.outputs.docs }}
      vm: ${{ steps.areas.outputs.vm }}
      verify: ${{ steps.areas.outputs.verify }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: areas
        shell: bash # -o pipefail: a failing script must fail the step, not hide behind tee
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # The merged PR this push came from, if its head has this exact
          # tree and its CI passed (rebase merges of an up-to-date branch
          # keep the tree). Any doubt, or an API failure, runs everything.
          tested_pr() {
            local pr head tree
            pr=$(gh api "repos/$REPO/commits/$GITHUB_SHA/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0] | "\(.number) \(.head.sha)"') || return 1
            read -r pr head <<<"$pr"
            [[ "$head" =~ ^[0-9a-f]{40}$ ]] || return 1
            tree=$(gh api "repos/$REPO/git/commits/$head" --jq .tree.sha) || return 1
            [ "$tree" = "$(git rev-parse "HEAD^{tree}")" ] || return 1
            # This workflow's own ci-ok, not a check run of that name any app
            # with checks:write could post, and this workflow's PR run passed.
            gh api "repos/$REPO/commits/$head/check-runs?check_name=ci-ok" \
              --jq '[.check_runs[] | select(.conclusion == "success" and .app.slug == "github-actions")] | length > 0' | grep -qx true || return 1
            gh api "repos/$REPO/actions/runs?head_sha=$head&event=pull_request" \
              --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .conclusion == "success")] | length > 0' | grep -qx true || return 1
            echo "::notice::the tree is PR #$pr's head ${head:0:7}, whose CI passed: not testing it again"
          }
          if [ "$EVENT" = pull_request ]; then
            scripts/changed-areas.sh "$BASE" "$HEAD" | tee -a "$GITHUB_OUTPUT"
          elif [ "$EVENT" = push ] && tested_pr; then
            printf 'go=false\nnix=false\nworkflows=false\ndocs=false\nvm=false\nverify=false\n' | tee -a "$GITHUB_OUTPUT"
          else
            # Not the VMs: the merged tree's VMs booted in its PR's run, and
            # releases boot them again (verify.yml -> vms.yml; #175).
            printf 'go=true\nnix=true\nworkflows=true\ndocs=true\nvm=false\nverify=false\n' | tee -a "$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - name: go mod tidy is clean
        run: go mod tidy -diff

  test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The Go releases the Go team supports; the oldest is go.mod's minimum.
        go: ["1.26", stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base commit's schema, for the compatibility check
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - name: Test (race detector, coverage)
        # Tests whose coverage depends on the runner's hardware are skipped
        # here, so the gate measures the same code on every machine.
        env:
          HWSPEC_SKIP_HOST_TESTS: "1"
        run: go test -race -count=1 -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Host tests (this runner's kernel and hardware)
        run: go test -count=1 -run 'Ethtool|BluetoothManagementSocket|SystemFiles|StickyWritable|FUSE|RecordingReproduces' ./...
      - name: Coverage gate
        if: matrix.go == 'stable'
        run: scripts/coverage.sh coverage.out "$COVERAGE_MIN" >> "$GITHUB_STEP_SUMMARY"
      # ADR 0003: a capture field may be added; renaming, removing or retyping
      # one needs a new schema_version (and with it a new capture-vN.json).
      - name: The capture format stays compatible
        if: matrix.go == 'stable' && github.event_name != 'push'
        shell: bash # -o pipefail: a failed git archive must fail the step
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          # A missing base must fail, not look like "no schema yet".
          : "${BASE:?no base commit for this event}"
          git cat-file -e "$BASE^{commit}" || { echo "::error::base commit $BASE isn't in the checkout"; exit 1; }
          mkdir -p "$RUNNER_TEMP/base"
          if git cat-file -e "$BASE:schema" 2>/dev/null; then # absent before the schema existed
            git archive "$BASE" schema | tar -x -C "$RUNNER_TEMP/base"
          fi
          go run ./tools/genschema check "$RUNNER_TEMP/base/schema" schema

  vulncheck:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  build:
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.vm == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      # amd64 only: the distro containers and the VMs run it, and start as
      # soon as it's uploaded (build-arm64 checks the other architecture).
      - name: Build static amd64
        run: |
          CGO_ENABLED=0 GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=ci-$GITHUB_SHA" -o dist/hwspec-amd64 ./cmd/hwspec
          file dist/hwspec-amd64 | tee /dev/stderr | grep -q 'statically linked'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hwspec-binaries
          path: dist/
          retention-days: 7

  # The arm64 binary must build static too; nothing in CI runs it (the
  # published arm64 binary runs in verify.yml's arm64 containers).
  build-arm64:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Build static arm64
        run: |
          CGO_ENABLED=0 GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=ci-$GITHUB_SHA" -o hwspec-arm64 ./cmd/hwspec
          file hwspec-arm64 | tee /dev/stderr | grep -q 'statically linked'

  # The same static binary must run on every target distro, with names
  # resolved (from the distro's ID files or the embedded copies). One job
  # runs the containers in parallel: a job per distro took 8 runner slots,
  # and the VMs queued behind them (#175).
  distros:
    needs: [changes, build]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hwspec-binaries
      - name: Capture inside every target distro
        shell: bash
        run: |
          chmod +x hwspec-amd64
          images=(
            docker.io/library/ubuntu:24.04
            docker.io/library/debian:12
            registry.fedoraproject.org/fedora:latest
            docker.io/library/archlinux:latest
            docker.io/library/alpine:latest
            docker.io/nixos/nix:latest
            # Linux Mint's Debian edition (LMDE 7, as Mint's own CI builds
            # it) and Devuan excalibur (Debian 13 without systemd, the
            # closest automatable stand-in for MX Linux's userland).
            docker.io/linuxmintd/lmde7-amd64@sha256:c9a7c5c147487db008a46f3b646e6a01fac64c6596490931496486c0f66f0232 # lmde7-amd64
            docker.io/devuan/devuan@sha256:8d0b211d065e8577c3650f476eca2f974a6ee1cc39f87b3cffcc955d1c8d812f # devuan:excalibur
          )
          # What one distro must pass, as its own script: a separate bash
          # keeps -e working (it's off inside conditions in this shell).
          cat > check.sh <<'SCRIPT'
          image=$1 dir=$2
          run() { docker run --rm --network=none -v "$PWD/hwspec-amd64:/hwspec:ro" "$image" /hwspec "$@"; }
          run capture -f json > "$dir/out.json"
          # Runner hardware varies (some Hyper-V VMs have no PCI bus), so
          # check invariants rather than specific devices.
          jq '{schema: (.schema_version == 1), container: (.os.virtualization == "container"),
               cpu_model: ((.cpu.identity.model // "") != ""), memory: (.memory.total_bytes > 0),
               os: .os.pretty_name, pci_devices: (.pci | length), warnings: .warnings}' "$dir/out.json" | tee "$dir/checks.json"
          jq -e '[.schema, .container, .cpu_model, .memory] | all' "$dir/checks.json"
          run ids
          # Names resolve on every distro, from its own files or the embedded copies.
          for q in "pci 8086" "usb 046d" "jedec 80CE" "cpu intel:6:9e:10"; do
            read -ra lookup <<<"$q" # "KIND ID" as two arguments
            run ids lookup "${lookup[@]}"
          done
          SCRIPT
          for i in "${!images[@]}"; do
            mkdir -p "d$i"
            { bash -euo pipefail check.sh "${images[$i]}" "d$i" > "d$i/log" 2>&1 && echo 0 > "d$i/rc" || echo $? > "d$i/rc"; } &
          done
          wait
          fail=0
          for i in "${!images[@]}"; do
            rc=$(cat "d$i/rc")
            echo "::group::${images[$i]} (exit $rc)"
            cat "d$i/log"
            echo "::endgroup::"
            if [ "$rc" != 0 ]; then
              echo "::error::hwspec failed inside ${images[$i]} (log above)"
              fail=1
            fi
          done
          exit "$fail"

  # Go changes and changes to the VM harness boot the VMs with the binary
  # just built (published builds go through them in verify.yml).
  vms:
    needs: [changes, build]
    if: needs.changes.outputs.vm == 'true'
    uses: ./.github/workflows/vms.yml
    with:
      artifact: hwspec-binaries
      binary: hwspec-amd64
      version: ci-${{ github.sha }} # the build job's -X main.version

  nix:
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build the flake (catches a stale vendorHash)
        run: nix build .#hwspec --print-build-logs && ./result/bin/hwspec capture -f text

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # PRs are rebase-merged, so every commit lands on main as written.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every commit follows Conventional Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-commits.sh "$BASE" "$HEAD"

  # Workflow syntax, expressions and embedded shell (shellcheck).
  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint (bundled shellcheck, pinned by digest)
        run: docker run --rm -v "$PWD:/repo" -w /repo docker.io/rhysd/actionlint:1.7.12@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7
      - name: Which CI jobs each kind of change selects
        run: scripts/changed-areas_test.sh
      - name: The commit message rules catch what they promise
        run: scripts/check-commits_test.sh

  # A PR that changes verify.yml or its scripts must still catch tampering,
  # on local copies of the live edge release's assets. PRs only: on main it
  # would make CI depend on edge, which itself waits for green CI on main
  # (verify.yml's tamper job covers every publish instead).
  verify-release:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.verify == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tampered copies of edge fail verification
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: scripts/verify-release_test.sh edge "$REPO"

  # Docs rules: every Mermaid diagram in the Markdown renders, and every
  # decision record is in the ADR index.
  mermaid:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the PR's base, to list the Markdown it changed
      # A PR renders the Markdown it changed (each diagram takes a container
      # start: all 25 took 90 s, #152); a change to CI itself, and main,
      # render every file.
      - name: Render the diagrams
        shell: bash # -o pipefail: a failed git diff must fail the step
        env:
          MERMAID_IMAGE: docker.io/minlag/mermaid-cli:12.0.0@sha256:30a3ca1a8af8632e9aee021e6a39738ff876239c5307f03734e89c5364ff5f38
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          CI_CHANGED: ${{ needs.changes.outputs.workflows }}
        run: |
          if [ "$EVENT" = pull_request ] && [ "$CI_CHANGED" = false ]; then
            git diff -z --no-renames --name-only --diff-filter=d "$BASE...$HEAD" -- '*.md' | xargs -0 -r scripts/check-mermaid.sh
          else
            git ls-files -z '*.md' | xargs -0 -r scripts/check-mermaid.sh
          fi
      - name: Every decision record is in the ADR index
        run: scripts/check-adr-index.sh

  # The single required check for branch protection. Jobs a change doesn't
  # need are skipped and count as passed; `changes` itself must succeed, or
  # a failure there would skip everything and pass vacuously.
  ci-ok:
    if: always()
    needs: [changes, lint, test, vulncheck, build, build-arm64, distros, vms, nix, actionlint, verify-release, mermaid, pr-title, commits]
    runs-on: ubuntu-24.04
    steps:
      - name: All needed checks passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # `changes` must have succeeded AND produced every output; without
          # them each gated job would be skipped and this gate pass vacuously.
          echo "$NEEDS" | jq -e '.changes.result == "success"
            and (.changes.outputs | has("go") and has("nix") and has("workflows") and has("docs") and has("vm") and has("verify"))
            and (.changes.outputs | to_entries | all(.value == "true" or .value == "false"))
            and (to_entries | all(.value.result == "success" or .value.result == "skipped"))'
