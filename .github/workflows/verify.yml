name: Verify release

# Checks what was actually published, as a user would get it: checksums,
# provenance attestations (signed by this repository's release or edge
# workflow, on GitHub-hosted runners), and the binaries themselves. How much
# depends on what was published (#190; the owner keeps edge, "maybe" used):
#   edge publish        integrity; the binary in one container per architecture
#                       (its tree already ran in all 8 distros in its PR)
#   release, by hand    integrity; the tamper test; every distro container
#                       (amd64, arm64); VMs with systemd, OpenRC and sysvinit
#   weekly              the tamper test against the live edge release: the
#                       verifier can drift with gh and the attestation service

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify (vX.Y.Z, vX.Y.Z-rc.N or edge)
        type: string
        required: true
  schedule:
    - cron: "23 6 * * 1" # Mondays: the tamper test against edge

env:
  # A release, or anything run by hand, gets every check; an edge publish
  # the proportionate ones; the schedule checks edge.
  TAG: ${{ inputs.tag || 'edge' }}
  FULL: ${{ (inputs.tag != '' && inputs.tag != 'edge') || github.event_name == 'workflow_dispatch' }}

permissions:
  contents: read
  attestations: read # gh attestation verify reads them through the API

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # a hang mustn't hold the check for GitHub's 6 h default (#189)
    outputs:
      commit: ${{ steps.check.outputs.commit }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download, check checksums and attestations
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          [[ "$TAG" =~ ^(edge|v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)$ ]] || { echo "::error::'$TAG' is not edge or vX.Y.Z[-pre]"; exit 1; }
          # The commit the tag names now: every tarball must have been built
          # from it, not from some earlier commit the same workflow signed.
          commit=$(gh api "repos/$REPO/commits/refs/tags/$TAG" --jq .sha)
          echo "Verifying $TAG at $commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          version=$TAG; [ "$TAG" = edge ] && version="edge-${commit:0:7}"
          echo "version=$version" >> "$GITHUB_OUTPUT" # what `hwspec version` must say
          gh release download "$TAG" --repo "$REPO" --dir dist
          scripts/verify-release.sh dist "$TAG" "$REPO" "$commit"
          for arch in amd64 arm64; do
            mkdir -p "bin/$arch"
            tar -C "bin/$arch" -xzf dist/hwspec-*-linux-$arch.tar.gz hwspec
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-binaries
          path: bin/
          retention-days: 7

  # The checks above must catch tampering: tampered local copies of these
  # same assets have to fail them (nothing published is touched).
  tamper:
    needs: integrity
    if: github.event_name == 'schedule' || (inputs.tag != '' && inputs.tag != 'edge') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # a hang mustn't hold the check for GitHub's 6 h default (#189)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tampered copies fail verification
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ needs.integrity.outputs.commit }} # refuse to test anything else
        run: scripts/verify-release_test.sh "$TAG" "$REPO" "$COMMIT"

  # One job per architecture runs its containers in parallel (#190, as CI
  # does since #180). Not on the schedule: it only re-tests the verifier.
  distros:
    needs: integrity
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15 # a hang mustn't hold the check for GitHub's 6 h default (#189)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-binaries
      - name: Run the published binary in the target distros
        shell: bash
        env:
          VERSION: ${{ needs.integrity.outputs.version }}
        run: |
          arch=amd64; [ "$(uname -m)" = aarch64 ] && arch=arm64
          if [ "$FULL" = true ]; then
            images=(
              docker.io/library/ubuntu:24.04
              docker.io/library/debian:12
              registry.fedoraproject.org/fedora:latest
              docker.io/library/alpine:latest
              docker.io/nixos/nix:latest
            )
            if [ "$arch" = amd64 ]; then # no arm64 images of these
              images+=(
                docker.io/library/archlinux:latest
                # Linux Mint's Debian edition (LMDE 7, as Mint's own CI builds
                # it) and Devuan excalibur (Debian 13 without systemd, the
                # closest automatable stand-in for MX Linux's userland).
                docker.io/linuxmintd/lmde7-amd64@sha256:c9a7c5c147487db008a46f3b646e6a01fac64c6596490931496486c0f66f0232 # lmde7-amd64
                docker.io/devuan/devuan@sha256:8d0b211d065e8577c3650f476eca2f974a6ee1cc39f87b3cffcc955d1c8d812f # devuan:excalibur
                # CachyOS (Arch-based, its own kernels and newer hwdata).
                docker.io/cachyos/cachyos@sha256:5a0a106e04d1b2af789cff0728881203ca956539a9e9171e9bb37d4bbd1d497b # cachyos:latest (2026-10-06)
              )
            fi
          else
            images=(docker.io/library/ubuntu:24.04)
          fi
          bin="$PWD/$arch/hwspec"; chmod +x "$bin"
          # What one distro must pass, as its own script: a separate bash
          # keeps -e working (it's off inside conditions in this shell).
          cat > check.sh <<'SCRIPT'
          image=$1 dir=$2 bin=$3
          run() { docker run --rm --network=none -v "$bin:/hwspec:ro" "$image" /hwspec "$@"; }
          version=$(run version)
          echo "$version"
          want="hwspec $VERSION"
          [ "$version" = "$want" ] || { echo "::error::version '$version' isn't '$want'"; exit 1; }
          run capture -f json > "$dir/out.json"
          jq '{schema: (.schema_version == 1), container: (.os.virtualization == "container"),
               arch: .os.arch, cpu_model: ((.cpu.identity.model // "") != ""), memory: (.memory.total_bytes > 0),
               os: .os.pretty_name, warnings: .warnings}' "$dir/out.json" | tee "$dir/checks.json"
          # arm64 server CPUs often report no model name, so x86_64 only.
          jq -e --arg m "$(uname -m)" '[.schema, .container, .memory, (.arch == $m), (.arch != "x86_64" or .cpu_model)] | all' "$dir/checks.json"
          for q in "pci 8086" "usb 046d" "jedec 80CE"; do
            read -ra lookup <<<"$q"
            run ids lookup "${lookup[@]}"
          done
          SCRIPT
          for i in "${!images[@]}"; do
            mkdir -p "d$i"
            { bash -euo pipefail check.sh "${images[$i]}" "d$i" "$bin" > "d$i/log" 2>&1 && echo 0 > "d$i/rc" || echo $? > "d$i/rc"; } &
          done
          wait
          fail=0
          for i in "${!images[@]}"; do
            rc=$(cat "d$i/rc")
            echo "::group::${images[$i]} (exit $rc)"
            cat "d$i/log"
            echo "::endgroup::"
            if [ "$rc" != 0 ]; then
              echo "::error::the published binary failed inside ${images[$i]} (log above)"
              fail=1
            fi
          done
          exit "$fail"

  # Releases only: an edge build's tree booted the VMs in its PR's CI or
  # the nightly run (owner, 2026-10-06, #175). Run by hand, any tag boots them.
  vms:
    needs: integrity
    if: (inputs.tag != '' && inputs.tag != 'edge') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/vms.yml
    with:
      artifact: verified-binaries
      binary: amd64/hwspec
      version: ${{ needs.integrity.outputs.version }}
