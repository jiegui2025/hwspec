name: Verify release

# Checks what was actually published, as a user would get it: checksums,
# provenance attestations (signed by this repository's release or edge
# workflow, on GitHub-hosted runners), and the binaries themselves: in the
# target distros' containers (amd64 and arm64) and in VMs with systemd,
# OpenRC and sysvinit (amd64; vms.yml). Runs after every publish; run it by
# hand for any tag from the Actions tab.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify (vX.Y.Z, vX.Y.Z-rc.N or edge)
        type: string
        required: true

permissions:
  contents: read
  attestations: read # gh attestation verify reads them through the API

jobs:
  integrity:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.check.outputs.commit }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download, check checksums and attestations
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          [[ "$TAG" =~ ^(edge|v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)$ ]] || { echo "::error::'$TAG' is not edge or vX.Y.Z[-pre]"; exit 1; }
          # The commit the tag names now: every tarball must have been built
          # from it, not from some earlier commit the same workflow signed.
          commit=$(gh api "repos/$REPO/commits/refs/tags/$TAG" --jq .sha)
          echo "Verifying $TAG at $commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          version=$TAG; [ "$TAG" = edge ] && version="edge-${commit:0:7}"
          echo "version=$version" >> "$GITHUB_OUTPUT" # what `hwspec version` must say
          gh release download "$TAG" --repo "$REPO" --dir dist
          scripts/verify-release.sh dist "$TAG" "$REPO" "$commit"
          for arch in amd64 arm64; do
            mkdir -p "bin/$arch"
            tar -C "bin/$arch" -xzf dist/hwspec-*-linux-$arch.tar.gz hwspec
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-binaries
          path: bin/
          retention-days: 7

  # The checks above must catch tampering: tampered local copies of these
  # same assets have to fail them (nothing published is touched).
  tamper:
    needs: integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tampered copies fail verification
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ needs.integrity.outputs.commit }} # refuse to test anything else
        run: scripts/verify-release_test.sh "$TAG" "$REPO" "$COMMIT"

  distros:
    needs: integrity
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        image:
          - docker.io/library/ubuntu:24.04
          - docker.io/library/debian:12
          - registry.fedoraproject.org/fedora:latest
          - docker.io/library/archlinux:latest
          - docker.io/library/alpine:latest
          - docker.io/nixos/nix:latest
          # Linux Mint's Debian edition (LMDE 7, as Mint's own CI builds it)
          # and Devuan excalibur (Debian 13 without systemd, the closest
          # automatable stand-in for MX Linux's userland); amd64 only.
          - docker.io/linuxmintd/lmde7-amd64@sha256:c9a7c5c147487db008a46f3b646e6a01fac64c6596490931496486c0f66f0232 # lmde7-amd64
          - docker.io/devuan/devuan@sha256:8d0b211d065e8577c3650f476eca2f974a6ee1cc39f87b3cffcc955d1c8d812f # devuan:excalibur
        exclude:
          - runner: ubuntu-24.04-arm # no arm64 image
            image: docker.io/library/archlinux:latest
          - runner: ubuntu-24.04-arm
            image: docker.io/linuxmintd/lmde7-amd64@sha256:c9a7c5c147487db008a46f3b646e6a01fac64c6596490931496486c0f66f0232
          - runner: ubuntu-24.04-arm
            image: docker.io/devuan/devuan@sha256:8d0b211d065e8577c3650f476eca2f974a6ee1cc39f87b3cffcc955d1c8d812f
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-binaries
      - name: Run the published binary in ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ needs.integrity.outputs.version }}
        run: |
          arch=amd64; [ "$(uname -m)" = aarch64 ] && arch=arm64
          bin="$PWD/$arch/hwspec"; chmod +x "$bin"
          run() { docker run --rm --network=none -v "$bin:/hwspec:ro" "$IMAGE" /hwspec "$@"; }
          version=$(run version)
          echo "$version"
          want="hwspec $VERSION"
          [ "$version" = "$want" ] || { echo "::error::version '$version' isn't '$want'"; exit 1; }
          run capture -f json > out.json
          jq '{schema: (.schema_version == 1), container: (.os.virtualization == "container"),
               arch: .os.arch, cpu_model: ((.cpu.identity.model // "") != ""), memory: (.memory.total_bytes > 0),
               os: .os.pretty_name, warnings: .warnings}' out.json | tee checks.json
          # arm64 server CPUs often report no model name, so x86_64 only.
          jq -e --arg m "$(uname -m)" '[.schema, .container, .memory, (.arch == $m), (.arch != "x86_64" or .cpu_model)] | all' checks.json
          for q in "pci 8086" "usb 046d" "jedec 80CE"; do
            read -ra lookup <<<"$q"
            run ids lookup "${lookup[@]}"
          done

  vms:
    needs: integrity
    uses: ./.github/workflows/vms.yml
    with:
      artifact: verified-binaries
      binary: amd64/hwspec
      version: ${{ needs.integrity.outputs.version }}
