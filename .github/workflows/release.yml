name: Release

# Push a tag like v0.2.0 to publish binaries. The job waits in the
# `production` environment until the owner approves it (v* tags only).
# Tags with a "-" (v0.1.0-rc.1) publish as pre-releases, never as Latest;
# for final tags GitHub decides Latest by version, so a patch to an older
# line (v0.1.1 after v0.2.0) doesn't take it.
# Release notes are generated from the merged pull requests (titled with
# Conventional Commits).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Before the owner is asked to approve anything, and without any write
  # permission (#191): the tag is a plain version on a commit that is on
  # main, CI passed on that commit, and no dependency has a known
  # vulnerability. The tests ran in CI on this commit; the job that can
  # publish and sign runs none of them.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read # the commit's ci-ok
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # main's history, to check the tag is on it
          persist-credentials: false
      - name: Validate the tag
        env:
          TAG: ${{ github.ref_name }}
        # The tag reaches make and shell; only plain semantic versions.
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::tag '$TAG' is not vX.Y.Z[-pre]"; exit 1; }
      - name: The tag is on main, and CI passed on it
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA isn't on main: release only what main holds"; exit 1; }
          # This workflow's own ci-ok, not a check of that name another app
          # could post.
          gh api "repos/$REPO/commits/$SHA/check-runs?check_name=ci-ok" \
            --jq '[.check_runs[] | select(.conclusion == "success" and .app.slug == "github-actions")] | length > 0' | grep -qx true \
            || { echo "::error::no passing ci-ok on $SHA"; exit 1; }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      # A release mustn't ship months-old offline ID data (#17): make
      # update-ids refreshes it. 45 days allows for a missed refresh.
      - name: The embedded ID databases are recent
        run: go run ./tools/genids fresh internal/ids/data 45

  release:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production # owner approval; v* tags only
    permissions:
      contents: write      # create the release
      id-token: write      # sign provenance attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the build never sees the write token
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false # release builds never reuse a cache other workflows wrote
      - name: Validate the tag (again, where it reaches make and the shell)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::tag '$TAG' is not vX.Y.Z[-pre]"; exit 1; }
      - name: Toolchain, for reproducing this build
        run: go version && tar --version | sed -n 1p && gzip --version | sed -n 1p
      - run: make release VERSION="$TAG"
        env:
          TAG: ${{ github.ref_name }}
      - name: Attest build provenance (verify with `gh attestation verify`)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/hwspec-*.tar.gz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }} # via env, never interpolated into the script
        run: |
          channel=() # final: GitHub marks it Latest only if it's the newest version
          if [[ "$TAG" == *-* ]]; then
            channel=(--prerelease --latest=false) # release candidates never become Latest
          fi
          gh release create "$TAG" build/hwspec-*.tar.gz build/SHA256SUMS \
            --title "hwspec $TAG" --generate-notes --verify-tag "${channel[@]}"

  verify:
    needs: release
    permissions:
      contents: read
      attestations: read
    uses: ./.github/workflows/verify.yml
    with:
      tag: ${{ github.ref_name }}
