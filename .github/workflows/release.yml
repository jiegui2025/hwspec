name: Release

# Push a tag like v0.2.0 to publish binaries. The job waits in the
# `production` environment until the owner approves it (v* tags only).
# Tags with a "-" (v0.1.0-rc.1) publish as pre-releases, never as Latest;
# for final tags GitHub decides Latest by version, so a patch to an older
# line (v0.1.1 after v0.2.0) doesn't take it.
# Release notes are generated from the merged pull requests (titled with
# Conventional Commits).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: production # owner approval; v* tags only
    permissions:
      contents: write      # create the release
      id-token: write      # sign provenance attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false # release builds never reuse a cache other workflows wrote
      - name: Validate the tag
        env:
          TAG: ${{ github.ref_name }}
        # The tag reaches make and shell; only plain semantic versions.
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::tag '$TAG' is not vX.Y.Z[-pre]"; exit 1; }
      - run: go version # the toolchain, for reproducing this build
      - run: make test
      - run: make release VERSION="$TAG"
        env:
          TAG: ${{ github.ref_name }}
      - name: Attest build provenance (verify with `gh attestation verify`)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/hwspec-*.tar.gz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }} # via env, never interpolated into the script
        run: |
          channel=() # final: GitHub marks it Latest only if it's the newest version
          if [[ "$TAG" == *-* ]]; then
            channel=(--prerelease --latest=false) # release candidates never become Latest
          fi
          gh release create "$TAG" build/hwspec-*.tar.gz build/SHA256SUMS \
            --title "hwspec $TAG" --generate-notes --verify-tag "${channel[@]}"

  verify:
    needs: release
    permissions:
      contents: read
      attestations: read
    uses: ./.github/workflows/verify.yml
    with:
      tag: ${{ github.ref_name }}
