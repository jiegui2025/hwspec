name: Edge

# After CI passes on main, publish the commit's build as the rolling "edge"
# pre-release (never Latest), then verify what was published.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Concurrency is decided before the job `if`, so only runs that will
# publish share the "edge" group; the rest get a group of their own and
# can't cancel a publish. Never cancel a running publish (it could stop
# between deleting and recreating the release); a newer pending run still
# replaces an older pending one.
concurrency:
  group: >-
    ${{ (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_repository.full_name == github.repository &&
         github.event.workflow_run.head_sha == github.sha) && 'edge' || format('edge-skip-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  publish:
    # The real gate (the same condition as the concurrency group above).
    # Only a green CI run for a push to this repository's main (not a PR
    # from a branch named main, not a fork), and only while that commit is
    # still main's tip: the attestation records GITHUB_SHA, which for
    # workflow_run is main's latest commit, so building an older one would
    # misstate its source. A newer push triggers its own run.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-24.04
    # Records deployments. Its "main only" branch policy can't block
    # anything here: under workflow_run, GITHUB_REF is always main.
    environment: edge
    permissions:
      contents: write      # replace the edge pre-release and its tag
      id-token: write      # sign provenance attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false # the build never sees the write token
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false # published builds never reuse a cache other workflows wrote
      - name: Build
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: make release VERSION="edge-${SHA:0:7}"
      - name: Attest build provenance (verify with `gh attestation verify`)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/hwspec-*.tar.gz
      - name: Replace the edge pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Only "not there yet" is fine; any other failure stops the job.
          if ! out=$(gh release delete edge --yes --cleanup-tag 2>&1); then
            grep -qx 'release not found' <<<"$out" || { echo "$out"; exit 1; }
          fi
          # A leftover tag would make create ignore --target and publish on
          # the old commit.
          if ! out=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/edge" 2>&1); then
            grep -q 'HTTP 404' <<<"$out" || { echo "$out"; exit 1; }
          else
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/edge"
          fi
          gh release create edge build/hwspec-*.tar.gz build/SHA256SUMS \
            --target "$SHA" --prerelease --latest=false --title "hwspec edge (${SHA:0:7})" \
            --notes "Rolling build of \`main\` at $SHA, after CI passed. Not a release: use the latest vX.Y.Z for anything that matters."
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/edge" --jq .sha)
          [ "$tagged" = "$SHA" ] || { echo "::error::edge tag is on $tagged, not $SHA"; exit 1; }

  verify:
    needs: publish
    permissions:
      contents: read
      attestations: read
    uses: ./.github/workflows/verify.yml
    with:
      tag: edge
