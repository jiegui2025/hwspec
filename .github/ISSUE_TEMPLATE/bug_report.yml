name: Bug report
description: hwspec crashed, reported something wrong, or missed hardware it should see
title: "fix: "
labels: ["type: defect", "status: triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: hwspec capture --full -f text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: hwspec version (`hwspec version`)
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution and kernel
      placeholder: Fedora 44, kernel 6.17
    validations:
      required: true
  - type: textarea
    id: capture
    attributes:
      label: Capture (optional but very helpful)
      description: Attach the output of `hwspec capture --redact -o spec.json`. `--redact` removes serial numbers, MAC addresses, UUIDs and the hostname.
