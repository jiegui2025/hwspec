name: Wrong or missing name
description: A device, CPU codename, memory maker or similar is named wrongly or not at all
title: "data(ids): "
labels: ["type: data", "status: triage"]
body:
  - type: markdown
    attributes:
      value: |
        One row per ID; several corrections can go in one report. `hwspec ids lookup KIND ID` shows what hwspec resolves today.

        | Database | Names | ID looks like |
        |---|---|---|
        | `pci` | PCI vendors and devices | `8086:3e92` |
        | `usb` | USB vendors and products | `046d:c52b` |
        | `pnp` | monitor makers | `DEL` |
        | `oui` | MAC address vendors | `04:0E:3C` |
        | `jedec` | memory makers | `F785` |
        | `amdgpu` | AMD GPU retail names | `1002:73bf:c1` |
        | `bluetooth` | Bluetooth chip makers | `2` |
        | `cpu` | CPU codenames | `intel:6:9e:10` |
  - type: textarea
    id: corrections
    attributes:
      label: Corrections
      description: "One row per ID, e.g. `| pci | 8086:3e92 | (nothing) | UHD Graphics 630 | link to the datasheet |`. The source can be a datasheet, the vendor's page, or the device's own label. Write \"not sure\" in the Database column if you don't know which one."
      value: |
        | Database | ID | hwspec shows | Correct name | Source |
        |---|---|---|---|---|
        | | | | | |
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Most databases come from upstream projects (pci-ids.ucw.cz, linux-usb.org, IEEE, the Linux kernel, …). Corrections made there reach every tool, and hwspec picks them up in the weekly bundle. The `cpu` curated list and anything hwspec-specific is fixed here.
