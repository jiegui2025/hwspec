rules:
  - id: firmware.load-failed
    check: firmware-load-failed
    category: needs-attention
    severity: warning
    title: A driver couldn't load its firmware
    detail: >-
      The kernel logged that a driver asked for a firmware file it didn't
      find. The device may not work at all, or work with less than it can.
    data:
      # The file the kernel asks for (a key ending in "/" covers its directory;
      # the longest key that covers a file wins: intel/sof/ over intel/)
      # → os-release ID → the package that ships it.
      packages:
        "amdgpu/": {arch: [{value: linux-firmware-amdgpu, src: arch-linux-firmware-amdgpu}]}
        "ath10k/": {arch: [{value: linux-firmware-atheros, src: arch-linux-firmware-atheros}]}
        "ath11k/": {arch: [{value: linux-firmware-atheros, src: arch-linux-firmware-atheros}]}
        "ath12k/": {arch: [{value: linux-firmware-atheros, src: arch-linux-firmware-atheros}]}
        "brcm/": {arch: [{value: linux-firmware-broadcom, src: arch-linux-firmware-broadcom}]}
        "i915/": {arch: [{value: linux-firmware-intel, src: arch-linux-firmware-intel}]}
        "intel/": {arch: [{value: linux-firmware-intel, src: arch-linux-firmware-intel}]}
        "intel/sof/": {arch: [{value: sof-firmware, src: arch-sof-firmware}]}
        "intel/sof-ace-tplg/": {arch: [{value: sof-firmware, src: arch-sof-firmware}]}
        "intel/sof-ipc4/": {arch: [{value: sof-firmware, src: arch-sof-firmware}]}
        "intel/sof-ipc4-lib/": {arch: [{value: sof-firmware, src: arch-sof-firmware}]}
        "intel/sof-ipc4-tplg/": {arch: [{value: sof-firmware, src: arch-sof-firmware}]}
        "intel/sof-tplg/": {arch: [{value: sof-firmware, src: arch-sof-firmware}]}
        "iwlwifi-*.ucode": {arch: [{value: linux-firmware-intel, src: arch-linux-firmware-intel}]}
        "mediatek/": {arch: [{value: linux-firmware-mediatek, src: arch-linux-firmware-mediatek}]}
        "nvidia/": {arch: [{value: linux-firmware-nvidia, src: arch-linux-firmware-nvidia}]}
        "radeon/": {arch: [{value: linux-firmware-radeon, src: arch-linux-firmware-radeon}]}
        "rtl_bt/": {arch: [{value: linux-firmware-realtek, src: arch-linux-firmware-realtek}]}
        "rtl_nic/": {arch: [{value: linux-firmware-realtek, src: arch-linux-firmware-realtek}]}
        "rtlwifi/": {arch: [{value: linux-firmware-realtek, src: arch-linux-firmware-realtek}]}
        "rtw88/": {arch: [{value: linux-firmware-realtek, src: arch-linux-firmware-realtek}]}
        "rtw89/": {arch: [{value: linux-firmware-realtek, src: arch-linux-firmware-realtek}]}
    actions:
      - text: >-
          The kernel looks for the file (the evidence names it) in
          /lib/firmware and its updates/ directory. Install the firmware
          package your distribution ships it in, then reboot (or reload
          the driver).
      - distro: arch
        text: Install the package that ships this file, then reboot.
        commands:
          - sudo pacman -S {package}
    src: [kernel-fw-loader, kernel-fw-search-path]
  - id: kernel.modules-missing
    check: kernel-modules-missing
    category: needs-attention
    severity: warning
    title: The running kernel's modules aren't installed; a reboot is pending
    detail: >-
      modprobe loads modules from the running kernel's module directory,
      and only other kernels' modules are installed: the kernel was
      upgraded since this boot. Until a reboot, no driver can be loaded,
      so devices without one can't be explained.
    actions:
      - text: Reboot into the installed kernel. Devices without a driver are checked again then.
    src: [modprobe-module-dir]
  - id: pci.driver-blacklisted
    check: pci-driver-blacklisted
    category: needs-attention
    severity: warning
    title: This device's drivers are all kept from loading
    detail: >-
      Every module that claims this device is kept from loading. Each
      entry's kind says how:
      "blacklist" stops modprobe loading it for a device, "kernel"
      (module_blacklist= on the command line) stops the kernel loading it
      at all, and "install" makes modprobe run a no-op instead.
    match:
      # As pci.no-driver: 02 network, 03 display, 0403 audio device,
      # 0c03 USB controller, 0d wireless.
      pci_class: ["02", "03", "0403", "0c03", "0d"]
    actions:
      - text: >-
          The evidence names the entry and where it is (a modprobe.d file,
          or the kernel command line). If it isn't deliberate, remove it,
          then load the module or reboot. Blacklists are often deliberate
          (a proprietary driver in place of an open one), so hwspec
          suggests no command.
    src: [modprobe-d-blacklist, modprobe-d-install, kernel-module-blacklist-param, modprobe-show-alias, pci-ids-classes, pci-ids-multimedia, pci-ids-serial-bus]
  - id: pci.driver-did-not-bind
    check: pci-driver-did-not-bind
    category: needs-attention
    severity: warning
    title: This device's driver is loaded but didn't take it
    detail: >-
      A module that claims this device is loaded (or built in), yet no
      driver is bound to the device: the driver's probe failed for it.
      Missing firmware is a common cause.
    match:
      # As pci.no-driver: 02 network, 03 display, 0403 audio device,
      # 0c03 USB controller, 0d wireless.
      pci_class: ["02", "03", "0403", "0c03", "0d"]
    actions:
      - text: Read this boot's kernel messages about the module; they usually say why.
        commands:
          - journalctl -k -b --grep {module}
    src: [kernel-driver-probe, kernel-driver-binding, journalctl-grep, modprobe-show-alias, pci-ids-classes, pci-ids-multimedia, pci-ids-serial-bus]
  - id: pci.driver-not-loaded
    check: pci-driver-not-loaded
    category: needs-attention
    severity: warning
    title: A driver for this device is installed but not loaded
    detail: >-
      A module of the running kernel claims this device, and nothing keeps
      it from loading, but it isn't loaded, so the device has no driver.
    match:
      # As pci.no-driver: 02 network, 03 display, 0403 audio device,
      # 0c03 USB controller, 0d wireless.
      pci_class: ["02", "03", "0403", "0c03", "0d"]
    actions:
      - text: Load the module; the device should get its driver at once.
        commands:
          - sudo modprobe {module}
        risk: A driver that misbehaves can hang the machine; save your work first.
        undo: sudo modprobe -r {module}
    src: [kernel-driver-binding, modprobe-module-dir, modprobe-show-alias, pci-ids-classes, pci-ids-multimedia, pci-ids-serial-bus]
  - id: pci.no-driver
    check: pci-without-driver
    category: needs-attention
    severity: warning
    title: No kernel driver is bound to this device
    detail: >-
      A device is only usable once a driver binds to it and initialises it.
      Network, display, audio, USB and wireless controllers have no other
      way to work. When the capture lists the running kernel's modules
      that claim the device and there are none, the kernel has no driver
      for it.
    match:
      # pci.ids classes: 02 network, 03 display, 0403 audio device,
      # 0c03 USB controller, 0d wireless.
      pci_class: ["02", "03", "0403", "0c03", "0d"]
    actions:
      - text: >-
          List the kernel modules that claim this device, by its modalias.
          If one is listed, load it; if modprobe says none is found, the
          running kernel has no driver for it (a newer kernel or an
          out-of-tree driver may).
        commands:
          - modprobe -R {modalias}
          - sudo modprobe MODULE
        undo: sudo modprobe -r MODULE
    src: [kernel-driver-binding, modprobe-show-alias, pci-ids-classes, pci-ids-multimedia, pci-ids-serial-bus]
