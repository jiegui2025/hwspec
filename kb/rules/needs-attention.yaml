sources:
  kernel-driver-binding:
    url: https://docs.kernel.org/driver-api/driver-model/binding.html
    title: Driver Binding (Linux kernel documentation)
    retrieved: "2026-10-06"
    licence: GPL-2.0-only
    confidence: upstream-doc
    quote: >-
      When a driver is attached to a device, the driver's probe() function
      is called. Within probe(), the driver initializes the device …
  modprobe-show-alias:
    url: https://man7.org/linux/man-pages/man8/modprobe.8.html
    title: modprobe(8), kmod
    retrieved: "2026-10-06"
    licence: GPL-2.0-or-later
    confidence: upstream-doc
    quote: "Print all module names matching an alias."
  pci-ids-classes:
    url: https://pci-ids.ucw.cz/read/PD/
    title: PCI ID repository, device classes
    retrieved: "2026-10-06"
    licence: GPL-2.0-or-later OR BSD-3-Clause
