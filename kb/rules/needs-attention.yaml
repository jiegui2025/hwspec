rules:
  - id: pci.no-driver
    check: pci-without-driver
    category: needs-attention
    severity: warning
    title: No kernel driver is bound to this device
    detail: >-
      A device is only usable once a driver binds to it and initialises it.
      Network, display, audio, USB and wireless controllers have no other
      way to work.
    match:
      # pci.ids classes: 02 network, 03 display, 0403 audio device,
      # 0c03 USB controller, 0d wireless.
      pci_class: ["02", "03", "0403", "0c03", "0d"]
    actions:
      - text: >-
          List the kernel modules that claim this device, by its modalias.
          If one is listed, load it; if modprobe says none is found, the
          running kernel has no driver for it (a newer kernel or an
          out-of-tree driver may).
        commands:
          - modprobe -R {modalias}
          - sudo modprobe MODULE
        undo: sudo modprobe -r MODULE
    src: [kernel-driver-binding, modprobe-show-alias, pci-ids-classes, pci-ids-multimedia, pci-ids-serial-bus]
