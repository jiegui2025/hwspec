    quote: "02 Network controller … 03 Display controller … 0d Wireless controller"
  pci-ids-multimedia:
    url: https://pci-ids.ucw.cz/read/PD/04
    title: PCI ID repository, multimedia controller subclasses
    retrieved: "2026-10-06"
