# Upgrade answers (#9): what the machine has, and what its documents say
# fits. Format: ADR 0009 and kb/README.md. The checks read the model's
# data from kb/models; a model without an entry gets the capture's facts
# and "unknown" for the rest, with the reason.

sources:
  kernel-pcie-bandwidth:
    url: https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/tree/drivers/pci/pci.h?h=v6.17
    title: drivers/pci/pci.h (Linux kernel)
    retrieved: "2026-10-07"
    licence: GPL-2.0-only
    confidence: upstream-doc
    quote: >-
      #define PCIE_SPEED2MBS_ENC(speed)
      ((speed) == PCIE_SPEED_64_0GT ? 64000*1/1 :
      (speed) == PCIE_SPEED_32_0GT ? 32000*128/130 :
      (speed) == PCIE_SPEED_16_0GT ? 16000*128/130 :
      (speed) == PCIE_SPEED_8_0GT  ?  8000*128/130 :
      (speed) == PCIE_SPEED_5_0GT  ?  5000*8/10 :
      (speed) == PCIE_SPEED_2_5GT  ?  2500*8/10 :
      0)

rules:
  - id: storage.upgrade
    check: storage-upgrade
    category: upgrade
    severity: info
    title: "Storage: bus, slots and what a faster drive gains"
    detail: >-
      Each NVMe drive's PCIe path comes from the capture, up to its root
      port: each link allows the lower speed and width of its two ends,
      and the path the least any link carries, counted as the kernel
      counts a lane after encoding (pcie_bandwidth_available). A link
      beyond the root port, such as a chipset's to the CPU, isn't in the
      capture and is said so. The model's M.2
      slots come from its documents, every claim with its source; which
      slot holds a drive comes from the firmware's slot table (--full).
    src: [capture, kernel-pcie-bandwidth]
  - id: memory.below-minimum
    check: memory-below-minimum
    category: upgrade
    severity: warning
    title: A memory module is rated slower than this model's documented minimum
    detail: >-
      The model's documents give a minimum module speed, and this module is
      rated below it: it may not run, or may slow the other modules down.
    actions:
      - text: >-
          Replace it with a module rated at the documented minimum or
          faster, of the type and form factor the model takes (see the
          memory answers).
        risk: Switch the machine off and unplug it before opening it; touch bare metal first to discharge static.
        undo: Put the old module back.
    src: [capture]
  - id: memory.upgrade
    check: memory-upgrade
    category: upgrade
    severity: info
    title: "Memory: slots, channels and speeds"
    detail: >-
      What is installed comes from the capture (the slot table needs
      --full); the rules for adding or replacing modules come from the
      model's documents, every claim with its source. Where documents
      disagree, all of them are shown.
    src: [capture]
