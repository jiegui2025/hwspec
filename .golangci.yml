version: "2"

linters:
  enable:
    - bodyclose
    - depguard
    - errorlint
    - forbidigo
    - gocritic
    - gosec
    - misspell
    - modernize
    - nolintlint
    - unconvert
    - unparam
  settings:
    # Package boundaries from ARCHITECTURE.md's "Packages" table and "Rules".
    # Test files may import test helpers and read testdata.
    depguard:
      rules:
        stdlib-only:
          list-mode: strict
          files: ["**/internal/report/*.go", "**/internal/ids/*.go", "**/internal/smbios/*.go", "**/internal/smbios/**/*.go", "**/internal/edid/*.go", "**/internal/spd/*.go", "**/internal/tpm/*.go", "**/internal/kb/*.go", "**/schema/*.go", "!$test"]
          allow: [$gostd]
        # Only internal/ids/sync.go (hwspec ids update) and
        # internal/fwindex/fetch.go (hwspec firmware update, ADR 0012) reach
        # the network, and only collect's health.go (smartctl) and the CLI
        # (pkexec) run programs: anywhere else, these imports fail.
        no-network:
          files: [$all, "!**/internal/ids/sync.go", "!**/internal/fwindex/fetch.go", "!$test"]
          deny:
            - pkg: net
              desc: "captures never touch the network: only internal/ids/sync.go and internal/fwindex/fetch.go download (ARCHITECTURE.md Rules)"
        no-subprocesses:
          files: [$all, "!**/internal/collect/health.go", "!**/cmd/hwspec/main.go", "!$test"]
          deny:
            - pkg: os/exec
              desc: "no external tools in the capture path except smartctl, run from internal/collect/health.go (ARCHITECTURE.md Rules)"
        collect:
          list-mode: strict
          files: ["**/internal/collect/*.go", "!$test"]
          allow:
            - $gostd
            - github.com/jiegui2025/hwspec/internal/report
            - github.com/jiegui2025/hwspec/internal/resolve
            - github.com/jiegui2025/hwspec/internal/smbios
            - github.com/jiegui2025/hwspec/internal/edid
            - github.com/jiegui2025/hwspec/internal/spd
            - github.com/jiegui2025/hwspec/internal/tpm
            - github.com/jiegui2025/hwspec/internal/trust
            - github.com/jiegui2025/hwspec/schema
            - github.com/jaypipes/ghw
            - golang.org/x/sys/unix
        # The advisor and its knowledge base are pure too (ADR 0009): the CLI
        # reads files and machine state and passes them in.
        parsers-are-pure:
          files: ["**/internal/smbios/*.go", "**/internal/edid/*.go", "**/internal/spd/*.go", "**/internal/tpm/*.go", "**/internal/kb/*.go", "**/internal/advisor/*.go", "**/internal/advisor/**/*.go", "!$test"]
          deny:
            - pkg: os
              desc: "parsers are pure: they get bytes and return values (ARCHITECTURE.md Rules)"
            - pkg: io/ioutil
              desc: "parsers are pure: they get bytes and return values (ARCHITECTURE.md Rules)"
            - pkg: net
              desc: "parsers are pure: they get bytes and return values (ARCHITECTURE.md Rules)"
            - pkg: syscall
              desc: "parsers are pure: they get bytes and return values (ARCHITECTURE.md Rules)"
            - pkg: unsafe
              desc: "parsers are pure: they get bytes and return values (ARCHITECTURE.md Rules)"
        output:
          list-mode: strict
          files: ["**/internal/output/*.go", "!$test"]
          allow: [$gostd, github.com/jiegui2025/hwspec/internal/report, go.yaml.in/yaml/v3]
        resolve:
          list-mode: strict
          files: ["**/internal/resolve/*.go", "!$test"]
          allow: [$gostd, github.com/jiegui2025/hwspec/internal/ids, github.com/jiegui2025/hwspec/internal/report]
        advisor:
          list-mode: strict
          files: ["**/internal/advisor/*.go", "**/internal/advisor/**/*.go", "!$test"]
          # schema: constants and embedded files only (the advice document
          # names its JSON Schema, as captures do from collect).
          allow: [$gostd, github.com/jiegui2025/hwspec/internal/report, github.com/jiegui2025/hwspec/internal/kb, github.com/jiegui2025/hwspec/schema]
        genkb:
          list-mode: strict
          files: ["**/tools/genkb/*.go", "!$test"]
          allow: [$gostd, github.com/jiegui2025/hwspec/internal/kb, github.com/jiegui2025/hwspec/internal/advisor, go.yaml.in/yaml/v3]
        fwindex:
          list-mode: strict
          files: ["**/internal/fwindex/*.go", "!$test"]
          allow: [$gostd, github.com/klauspost/compress/zstd, github.com/jiegui2025/hwspec/internal/trust]
        trust:
          list-mode: strict
          files: ["**/internal/trust/*.go", "!$test"]
          allow: [$gostd, golang.org/x/sys/unix]
    # The pure packages (depguard parsers-are-pure) also can't reach the
    # file system or the clock through the standard library's other doors.
    # Applied to those paths only, below.
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^time\.Now$
          msg: "pure packages get the time as a value (advisor.Input.Now)"
        - pattern: ^filepath\.(Glob|Walk|WalkDir|EvalSymlinks|Abs)$
          msg: "pure packages don't read the file system"
    gosec:
      excludes:
        - G104 # unhandled errors: errcheck covers this, with its own exclusions
        - G115 # integer conversions: hardware values are range-checked where it matters
        - G204 # subprocesses: pkexec and smartctl are invoked with fixed arguments
        - G304 # file paths from variables: reading sysfs/procfs is the point
        - G306 # 0644 output files are intended
    gocritic:
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, forbidigo]
      - path-except: internal/(smbios|edid|spd|tpm|kb|advisor)/
        linters: [forbidigo]
      - path: ^tools/ # build-time generators reading paths given on the command line
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/jiegui2025/hwspec
